name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the bottom bar of the console, or in the VERSION file
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options: [Windows installer (GPU), Windows installer (CPU), From source]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From the logs folder (web.log, engine.log). Remove tokens and passwords first.
      render: text
