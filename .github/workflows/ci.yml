name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web tests (Django)
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"        # tests run in development mode; start-up checks are tested in their own process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        working-directory: web
        run: python manage.py makemigrations --check --dry-run
      - name: Translations compile
        run: python scripts/compile_translations.py
      - name: Tests
        working-directory: web
        run: python manage.py test

  engine:
    name: Engine tests (CPU only, no GPU or model weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the light dependencies the tests need
        run: pip install numpy opencv-python-headless PyYAML requests imageio-ffmpeg pytest
      - run: python -m pytest engine/tests -q

  desktop:
    name: Launcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest PyYAML
      - run: python -m pytest desktop/tests -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
